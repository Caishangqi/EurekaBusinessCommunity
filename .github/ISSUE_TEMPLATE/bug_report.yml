name: "Bug Report"
description: "Report a bug, crash, or unexpected game behavior in EurekaBusiness"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide as much relevant detail as possible.
  - type: input
    id: mod_version
    attributes:
      label: "Mod Version"
      description: "Exact EurekaBusiness build version (e.g. 1.0.0-beta.1)"
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: "Minecraft & NeoForge Version"
      description: "Minecraft and exact NeoForge loader version"
      placeholder: "1.21.1 / NeoForge 21.1.238"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Game Environment"
      options:
        - "Singleplayer World"
        - "Multiplayer Dedicated Server"
        - "LAN Game"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description of the Bug"
      description: "A clear and concise description of what happened."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Numbered steps to reproduce the issue."
      placeholder: |
        1. Place a Key Device and insert the Shop Key
        2. Set up a Display Pedestal with an item
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Crash Log / Latest Log"
      description: "Please paste the relevant crash report or link to a pastebin / gist."
      render: text
